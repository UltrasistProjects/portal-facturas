{% if page.pages > 1 %}<nav class="pagination-bar" aria-label="Paginación"><span>Página {{ page.page }} de {{ page.pages }} · {{ page.total }} registros</span>{% if page.has_prev %}<a class="btn btn-sm btn-light" href="?{% if base_query %}{{ base_query }}&{% endif %}page={{ page.page - 1 }}">Anterior</a>{% endif %}{% if page.has_next %}<a class="btn btn-sm btn-light" href="?{% if base_query %}{{ base_query }}&{% endif %}page={{ page.page + 1 }}">Siguiente</a>{% endif %}</nav>{% endif %}
