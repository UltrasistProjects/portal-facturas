# Textos del tema "ultrasist" en espanol de Mexico, con "usted" (UTF-8). Las claves ultrasist* son propias del tema;
# las demas sobrescriben las de base/login/messages/messages_es.properties de Keycloak que aparecen en el inicio de
# sesion, el restablecimiento y el cambio de contrasena. Las que no estan aqui siguen saliendo de Keycloak.
# Keycloak formatea los mensajes con MessageFormat: {0} es un parametro y el apostrofo se escribe doble.

