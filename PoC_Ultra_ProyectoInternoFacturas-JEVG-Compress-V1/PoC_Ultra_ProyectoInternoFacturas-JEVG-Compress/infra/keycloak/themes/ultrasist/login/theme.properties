# Tema de login "ultrasist": el diseno del login anterior del portal sobre las plantillas de Keycloak.
# Hereda de "base" (plantillas sin estilos): las paginas que no se sobrescriben usan template.ftl y las clases kc* de
# abajo, asi que ninguna muestra el diseno por defecto (keycloak.v2 / PatternFly).
parent=base
import=common/keycloak
# Solo espanol: los textos propios (claves ultrasist*) existen unicamente en messages_es.properties.
locales=es

# Version de Keycloak de las plantillas de base/login que sobrescribe el tema (template, login, login-reset-password,
# login-update-password). Al cambiar la imagen de compose.yaml hay que compararlas con las de la nueva version y
# actualizar este valor; una prueba lo exige.
keycloakVersion=26.7.4

styles=vendor/bootstrap.min.css vendor/bootstrap-icons.min.css css/ultrasist.css

# Clases que usan las plantillas de base, asignadas a Bootstrap 5 y a css/ultrasist.css.
kcBodyClass=login-body
kcLoginClass=login-page
kcFormCardClass=login-card
kcFormClass=login-form
kcFormGroupClass=form-group
kcLabelClass=form-label
kcInputClass=form-control
kcTextareaClass=form-control
kcInputGroup=input-group
kcInputErrorMessageClass=invalid-feedback d-block
kcFormSettingClass=form-settings
kcFormOptionsClass=form-options
kcFormOptionsWrapperClass=form-options-wrapper
kcFormButtonsClass=form-buttons
kcSignUpClass=login-info

kcButtonClass=btn
kcButtonPrimaryClass=btn-primary
kcButtonDefaultClass=btn-light
kcButtonSecondaryClass=btn-light
kcButtonBlockClass=w-100

kcCheckboxInputClass=form-check-input
kcInputClassCheckbox=form-check
kcInputClassCheckboxInput=form-check-input
kcInputClassCheckboxLabel=form-check-label
kcInputClassRadio=form-check
kcInputClassRadioInput=form-check-input
kcInputClassRadioLabel=form-check-label

kcAlertClass=alert login-alert
kcAlertTitleClass=kc-feedback-text
kcFeedbackErrorIcon=bi bi-exclamation-circle
kcFeedbackWarningIcon=bi bi-exclamation-triangle
kcFeedbackSuccessIcon=bi bi-check-circle
kcFeedbackInfoIcon=bi bi-info-circle
kcResetFlowIcon=bi bi-arrow-repeat

kcFormPasswordVisibilityButtonClass=btn password-toggle
kcFormPasswordVisibilityIconShow=bi bi-eye
kcFormPasswordVisibilityIconHide=bi bi-eye-slash

kcFormSocialAccountSectionClass=login-social
kcFormSocialAccountListClass=list-unstyled d-grid gap-2
kcFormSocialAccountListButtonClass=btn btn-light w-100
kcSelectAuthListClass=list-group
kcSelectAuthListItemClass=list-group-item list-group-item-action
