[tool.ruff]
line-length = 120
target-version = "py312"
extend-exclude = ["app/static/vendor"]

[tool.ruff.lint]
select = ["E", "F", "W", "I"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov=app --cov-report=term-missing:skip-covered --cov-report=xml"
filterwarnings = [
    # PyMuPDF (SWIG) emite estas advertencias al importarse en Python 3.12+.
    "ignore:builtin type Swig.* has no __module__ attribute:DeprecationWarning",
    "ignore:builtin type swigvarlink has no __module__ attribute:DeprecationWarning",
]

[tool.coverage.run]
source = ["app"]
branch = true

[tool.coverage.report]
exclude_also = ["if TYPE_CHECKING:"]
