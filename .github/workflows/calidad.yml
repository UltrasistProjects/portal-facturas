# Invoca el pipeline compartido del equipo. No duplicar lógica aquí.
name: Calidad

on:
  push:
    branches: [qa, main]
  pull_request:
    branches: [qa, main]

jobs:
  calidad:
    uses: UltrasistProjects/ci-templates/.github/workflows/sonarqube.yml@v1
    with:
      working_directory: ./PoC_Ultra_ProyectoInternoFacturas-JEVG-Compress-V1/PoC_Ultra_ProyectoInternoFacturas-JEVG-Compress
      project_key: portal-facturas
      runner: self-hosted
      setup_python: false
      # Las pruebas necesitan PostgreSQL: el script levanta uno desechable con compose.yaml y lo elimina al terminar.
      # DOCKER_CONTEXT=default: Docker Engine del sistema (el contexto activo del usuario es Docker Desktop, que suele
      # estar detenido).
      test_command: DOCKER_CONTEXT=default python scripts/ci_tests.py --cov=app --cov-report=xml:coverage.xml
    secrets: inherit